services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mobited
      POSTGRES_PASSWORD: mobited
      POSTGRES_DB: mobited
    ports:
      - "5432:5432"
    volumes:
      - mobited-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mobited"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mobited-postgres:
